name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev zip
      - name: Verify application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)"
          test "$RELEASE_TAG" = "v$version"
      - name: Build and package Linux
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make clean all test
          bash scripts/package-linux.sh "$RELEASE_TAG"
      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build Android unsigned release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Sign Android release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: bash scripts/sign-android-release.sh "$RELEASE_TAG"
      - name: Generate checksums
        run: cd dist && sha256sum Falcon-Police-Mode-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/Falcon-Police-Mode-* dist/SHA256SUMS \
            --verify-tag --title "Police Mode Enabler $RELEASE_TAG" --generate-notes
